name: Public Views Hotfix

on:
  push:
    branches:
      - fix/cpanel-public-views
    paths:
      - '.github/workflows/hotfix-public-views.yml'
      - 'resources/views/public/**'

permissions:
  contents: read

jobs:
  package-hotfix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Assemble hotfix
        run: |
          mkdir -p hotfix/nexvary_app/resources/views
          cp -a resources/views/public hotfix/nexvary_app/resources/views/public
          for view in layout.blade.php home.blade.php services.blade.php apps.blade.php safescan.blade.php about.blade.php contact.blade.php; do
            test -f "hotfix/nexvary_app/resources/views/public/$view"
          done
          test -f hotfix/nexvary_app/resources/views/public/our-work/index.blade.php
          test -f hotfix/nexvary_app/resources/views/public/our-work/show.blade.php
          (cd hotfix && zip -qr ../NEXVARY-Public-Views-Hotfix.zip nexvary_app)

      - name: Upload hotfix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NEXVARY-Public-Views-Hotfix
          path: NEXVARY-Public-Views-Hotfix.zip
          if-no-files-found: error
          retention-days: 3
