name: Dependency Locks

on:
  push:
    branches: ['foundation/**']
    paths:
      - 'composer.json'
      - 'package.json'
      - '.github/workflows/dependency-locks.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Generate Composer lock
        run: |
          if [ -f composer.lock ]; then
            composer update --lock --no-interaction --prefer-dist
          else
            composer update --no-interaction --prefer-dist
          fi
      - name: Generate npm lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexvary-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles are already current.'
            exit 0
          fi
          git commit -m 'build: lock PHP and Node dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}
