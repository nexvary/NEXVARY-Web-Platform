name: Release Gate

on:
  push:
    branches: [main, 'foundation/**', 'feature/**', 'security/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run types:check
      - run: npm run build
      - run: npm audit --audit-level=high

  security-static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{20,})' -- . ':!*.lock'
      - name: Reject dangerous PHP execution primitives
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE '\b(eval|exec|shell_exec|passthru|system|proc_open|popen)\s*\(' -- '*.php' ':!vendor/**'
      - name: Reject accidental debug exposure
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE '^APP_DEBUG=true$' -- '.env*'

  visual-release-gate:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security-static-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Prepare Laravel runtime
        run: |
          cp .env.example .env
          printf '\nCACHE_STORE=array\nQUEUE_CONNECTION=sync\n' >> .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
      - name: Start Laravel
        run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/nexvary-laravel.log 2>&1 &
      - name: Wait for application
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexvary-laravel.log
          exit 1
      - name: Security header smoke gate
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSI http://127.0.0.1:8000/about | tr -d '\r')"
          grep -qi '^Content-Security-Policy:' <<< "$headers"
          grep -qi '^X-Content-Type-Options: nosniff' <<< "$headers"
          grep -qi '^X-Frame-Options: DENY' <<< "$headers"
          grep -qi '^Referrer-Policy: strict-origin-when-cross-origin' <<< "$headers"
      - run: npm run visual:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-release-gate-screenshots
          path: |
            artifacts/screenshots
            playwright-report
          if-no-files-found: warn
          retention-days: 14
