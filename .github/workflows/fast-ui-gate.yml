name: Fast UI Gate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'resources/**'
      - 'routes/**'
      - 'scripts/**'
      - 'tests/visual/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/fast-ui-gate.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'resources/**'
      - 'routes/**'
      - 'scripts/**'
      - 'tests/visual/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/fast-ui-gate.yml'

permissions:
  contents: read

concurrency:
  group: fast-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Fast static security gate
        run: npm run security:gate
      - name: Typecheck and build
        run: |
          npm run types:check
          npm run build
      - name: Install Chromium only on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Prepare lightweight Laravel runtime
        run: |
          cp .env.example .env
          printf '\nCACHE_STORE=array\nQUEUE_CONNECTION=sync\nDB_CONNECTION=sqlite\nDB_DATABASE=${{ github.workspace }}/database/database.sqlite\n' >> .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
      - name: Start Laravel
        run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/nexvary-fast-ui.log 2>&1 &
      - name: Wait for application
        shell: bash
        run: |
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nexvary-fast-ui.log
          exit 1
      - name: Run focused UI smoke gate
        run: npx playwright test tests/visual/release-gate.spec.ts --project=android15 --grep "Android 15 viewport-safe tap target gate|Arabic RTL alignment gate|has no horizontal overflow"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: fast-ui-failure-artifacts
          path: |
            artifacts/screenshots
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 5
