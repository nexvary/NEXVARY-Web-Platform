name: Pint Diff Diagnostic
on:
  push:
    branches:
      - work/aws-activate-deployment-platform
    paths:
      - '.github/workflows/pint-diff.yml'
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Show Pint diff
        shell: bash
        run: |
          vendor/bin/pint app/Services/Deployment/DeploymentPublisher.php
          git diff -- app/Services/Deployment/DeploymentPublisher.php
