name: cPanel Ready Bundle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cpanel-package.yml'
      - 'scripts/build-cpanel.sh'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'storage/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cpanel-package.yml'
      - 'scripts/build-cpanel.sh'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'storage/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          ini-file: production
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Assemble cPanel bundle
        run: bash scripts/build-cpanel.sh

      - name: Verify secure one-click installer is packaged
        run: |
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'public_html/setup-nexvary.php'
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'INSTALL-NEXVARY.txt'
          unzip -p NEXVARY-cPanel-Ready.zip public_html/setup-nexvary.php > /tmp/setup-nexvary.php
          php -l /tmp/setup-nexvary.php
          grep -q 'hash_equals' /tmp/setup-nexvary.php
          grep -q '@unlink(__FILE__)' /tmp/setup-nexvary.php

      - name: Verify public Blade views are packaged
        run: |
          for view in \
            layout.blade.php \
            home.blade.php \
            services.blade.php \
            apps.blade.php \
            safescan.blade.php \
            about.blade.php \
            contact.blade.php \
            privacy.blade.php \
            terms.blade.php; do
            unzip -l NEXVARY-cPanel-Ready.zip | grep -q "nexvary_app/resources/views/public/$view"
          done
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'nexvary_app/resources/views/public/our-work/index.blade.php'
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'nexvary_app/resources/views/public/our-work/show.blade.php'
          unzip -p NEXVARY-cPanel-Ready.zip nexvary_app/routes/public-seo.php | grep -q "view('public.home')"

      - name: Runtime smoke test packaged cPanel artifact
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="$RUNNER_TEMP/cpanel-runtime"
          rm -rf "$RUNTIME"
          mkdir -p "$RUNTIME"
          unzip -q NEXVARY-cPanel-Ready.zip -d "$RUNTIME"

          SETUP_URL="$(grep -oE 'https://nexvary\.com/setup-nexvary\.php\?key=[0-9a-f]+' "$RUNTIME/INSTALL-NEXVARY.txt" | head -1)"
          test -n "$SETUP_URL"
          SETUP_PATH="${SETUP_URL#https://nexvary.com}"

          cd "$RUNTIME"
          php -S 127.0.0.1:8787 -t public_html > "$RUNNER_TEMP/cpanel-runtime-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:8787${SETUP_PATH}" -o "$RUNNER_TEMP/setup-result.html"; then
              break
            fi
            sleep 1
          done

          grep -q 'تم تثبيت NEXVARY بنجاح' "$RUNNER_TEMP/setup-result.html"
          test ! -e "$RUNTIME/public_html/setup-nexvary.php"
          test -e "$RUNTIME/nexvary_app/.installed"

          for route in / /services /apps /safescan /about /contact /our-work /privacy /terms /sitemap.xml; do
            code="$(curl -sS -o "$RUNNER_TEMP/route-body" -w '%{http_code}' "http://127.0.0.1:8787${route}")"
            if [ "$code" != "200" ]; then
              echo "Route ${route} returned HTTP ${code}"
              cat "$RUNNER_TEMP/route-body" || true
              cat "$RUNNER_TEMP/cpanel-runtime-server.log" || true
              tail -200 "$RUNTIME/nexvary_app/storage/logs/laravel.log" || true
              exit 1
            fi
          done

      - name: Upload cPanel ready package
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NEXVARY-cPanel-Ready
          path: NEXVARY-cPanel-Ready.zip
          if-no-files-found: error
          retention-days: 14
