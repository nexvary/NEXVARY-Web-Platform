name: cPanel Ready Bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cpanel-package.yml'
      - 'scripts/build-cpanel.sh'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'storage/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          ini-file: production
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Build production application
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          npm ci
          npm run build

      - name: Assemble cPanel bundle
        run: bash scripts/build-cpanel.sh

      - name: Verify installer package
        run: |
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'public_html/setup-nexvary.php'
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'INSTALL-NEXVARY.txt'
          unzip -p NEXVARY-cPanel-Ready.zip public_html/setup-nexvary.php > /tmp/setup-nexvary.php
          php -l /tmp/setup-nexvary.php
          grep -q 'hash_equals' /tmp/setup-nexvary.php
          grep -q 'password_confirmation' /tmp/setup-nexvary.php
          grep -q "'role'=>'owner'" /tmp/setup-nexvary.php
          grep -q '@unlink(__FILE__)' /tmp/setup-nexvary.php

      - name: Runtime owner onboarding smoke test
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="$RUNNER_TEMP/cpanel-runtime"
          rm -rf "$RUNTIME" && mkdir -p "$RUNTIME"
          unzip -q NEXVARY-cPanel-Ready.zip -d "$RUNTIME"
          KEY="$(grep -oE 'key=[0-9a-f]+' "$RUNTIME/INSTALL-NEXVARY.txt" | head -1 | cut -d= -f2)"
          test -n "$KEY"

          cd "$RUNTIME"
          php -S 127.0.0.1:8787 -t public_html > "$RUNNER_TEMP/cpanel-runtime-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            curl -fsS "http://127.0.0.1:8787/setup-nexvary.php?key=$KEY" -o "$RUNNER_TEMP/setup-form.html" && break
            sleep 1
          done
          grep -q 'إنشاء حساب المالك الأول' "$RUNNER_TEMP/setup-form.html"

          curl -fsS -X POST "http://127.0.0.1:8787/setup-nexvary.php?key=$KEY" \
            --data-urlencode 'name=NEXVARY Owner' \
            --data-urlencode 'email=owner-ci@nexvary.invalid' \
            --data-urlencode 'password=NEXVARY-CI-Owner-2026!' \
            --data-urlencode 'password_confirmation=NEXVARY-CI-Owner-2026!' \
            -o "$RUNNER_TEMP/setup-result.html"

          grep -q 'تم إنشاء حساب المالك بنجاح' "$RUNNER_TEMP/setup-result.html"
          test ! -e "$RUNTIME/public_html/setup-nexvary.php"
          test -e "$RUNTIME/nexvary_app/.installed"
          php -r '$db=new PDO("sqlite:'"$RUNTIME"'/nexvary_app/database/database.sqlite"); $q=$db->query("select count(*) from users where email=\"owner-ci@nexvary.invalid\" and is_admin=1 and role=\"owner\""); exit(((int)$q->fetchColumn())===1?0:1);'

          for route in / /services /apps /safescan /about /contact /our-work /sitemap.xml /secure-control; do
            code="$(curl -sS -L -o "$RUNNER_TEMP/route-body" -w '%{http_code}' "http://127.0.0.1:8787${route}")"
            test "$code" = "200" || { echo "Route ${route} returned HTTP ${code}"; exit 1; }
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture verified visual screenshots
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="$RUNNER_TEMP/cpanel-runtime"
          mkdir -p release-screenshots
          cd "$RUNTIME"
          php -S 127.0.0.1:8787 -t public_html > "$RUNNER_TEMP/cpanel-screenshot-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          npx playwright screenshot --browser=chromium --viewport-size='1440,1100' --full-page --wait-for-timeout=1600 http://127.0.0.1:8787/ release-screenshots/home-desktop.png
          npx playwright screenshot --browser=chromium --device='Pixel 5' --full-page --wait-for-timeout=1600 http://127.0.0.1:8787/ release-screenshots/home-mobile.png
          test -s release-screenshots/home-desktop.png
          test -s release-screenshots/home-mobile.png

      - name: Upload verified screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NEXVARY-Verified-Screenshots
          path: release-screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload cPanel ready package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NEXVARY-cPanel-Ready
          path: NEXVARY-cPanel-Ready.zip
          if-no-files-found: error
          retention-days: 14
