name: cPanel Ready Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cpanel-package.yml'
      - 'scripts/build-cpanel.sh'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'storage/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
  pull_request:
    paths:
      - '.github/workflows/cpanel-package.yml'
      - 'scripts/build-cpanel.sh'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'storage/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          ini-file: production
          extensions: sqlite3, pdo_sqlite, mbstring

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Assemble cPanel bundle
        run: bash scripts/build-cpanel.sh

      - name: Verify secure one-click installer is packaged
        run: |
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'public_html/setup-nexvary.php'
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'INSTALL-NEXVARY.txt'
          unzip -p NEXVARY-cPanel-Ready.zip public_html/setup-nexvary.php > /tmp/setup-nexvary.php
          php -l /tmp/setup-nexvary.php
          grep -q 'hash_equals' /tmp/setup-nexvary.php
          grep -q '@unlink(__FILE__)' /tmp/setup-nexvary.php

      - name: Verify public Blade views are packaged
        run: |
          for view in \
            layout.blade.php \
            home.blade.php \
            services.blade.php \
            apps.blade.php \
            safescan.blade.php \
            about.blade.php \
            contact.blade.php; do
            unzip -l NEXVARY-cPanel-Ready.zip | grep -q "nexvary_app/resources/views/public/$view"
          done
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'nexvary_app/resources/views/public/our-work/index.blade.php'
          unzip -l NEXVARY-cPanel-Ready.zip | grep -q 'nexvary_app/resources/views/public/our-work/show.blade.php'
          unzip -p NEXVARY-cPanel-Ready.zip nexvary_app/routes/public-seo.php | grep -q "view('public.home')"

      - name: Runtime smoke test packaged cPanel site
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/nexvary-cpanel-smoke
          APP="$ROOT/nexvary_app"
          WEB="$ROOT/public_html"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          unzip -q NEXVARY-cPanel-Ready.zip -d "$ROOT"

          mkdir -p \
            "$APP/storage/framework/sessions" \
            "$APP/storage/framework/cache/data" \
            "$APP/storage/framework/views" \
            "$APP/bootstrap/cache"
          touch "$APP/database/database.sqlite"
          APP_KEY="base64:$(openssl rand -base64 32 | tr -d '\n')"
          cat > "$APP/.env" <<EOF
          APP_NAME="NEXVARY"
          APP_ENV=production
          APP_KEY=$APP_KEY
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:8099
          LOG_CHANNEL=stack
          DB_CONNECTION=sqlite
          DB_DATABASE=$APP/database/database.sqlite
          SESSION_DRIVER=file
          SESSION_ENCRYPT=false
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          EOF

          chmod -R u+rwX "$APP/storage" "$APP/bootstrap/cache" "$APP/database"
          (
            cd "$APP"
            php artisan migrate --force
            php artisan optimize:clear
          )

          php -S 127.0.0.1:8099 -t "$WEB" "$WEB/index.php" >/tmp/nexvary-cpanel-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/ >/tmp/nexvary-home.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/nexvary-cpanel-server.log || true
            cat "$APP/storage/logs/laravel.log" || true
            exit 1
          fi

          for route in / /services /apps /safescan /about /contact /our-work /health; do
            code="$(curl -sS -o /tmp/nexvary-response.html -w '%{http_code}' "http://127.0.0.1:8099$route")"
            if [ "$code" != "200" ]; then
              echo "Packaged route failed: $route returned HTTP $code"
              cat /tmp/nexvary-response.html || true
              cat /tmp/nexvary-cpanel-server.log || true
              cat "$APP/storage/logs/laravel.log" || true
              exit 1
            fi
          done
          grep -qi 'NEXVARY' /tmp/nexvary-home.html

      - name: Upload cPanel ready package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NEXVARY-cPanel-Ready
          path: NEXVARY-cPanel-Ready.zip
          if-no-files-found: error
          retention-days: 14
